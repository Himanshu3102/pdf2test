services:
  - type: web
    name: pdf2test-backend
    env: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: STORAGE_DIR
        value: /tmp/uploads
      - key: AUTH_SECRET_KEY
        generateValue: true
      - key: AUTH_TOKEN_TTL_DAYS
        value: 30
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: MAX_UPLOAD_MB
        value: 25
      - key: OCR_ENABLED
        value: true
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://YOUR-FRONTEND.vercel.app
